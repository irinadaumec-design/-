<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌿 Фокус — игры с таймером</title><style>body{font-family:system-ui,sans-serif;background:#f3f7f5;color:#25433b;max-width:760px;margin:25px auto;padding:12px}section{background:white;padding:20px;border-radius:18px;margin:15px 0;box-shadow:0 2px 12px #16442b10}button,select{border:1px solid #bdd3c9;border-radius:10px;padding:12px;background:#fff;color:#25433b;cursor:pointer;margin:3px}button.active,.primary{background:#347b63;color:white}button:disabled{opacity:.5}#board{display:grid;gap:7px;margin:20px auto;max-width:450px}.tile{min-height:55px;font-size:23px;font-weight:bold;background:#e9f3ee}.found{background:#a7d7bf}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.stat{display:inline-block;margin-right:20px}#msg{min-height:24px;color:#347b63}.scene{position:relative;background:#e9f4ec;aspect-ratio:1.2;border-radius:12px;cursor:pointer}.object{position:absolute;transform:translate(-50%,-50%);font-size:clamp(24px,5vw,38px)}.ring{position:absolute;border:3px solid #30875d;border-radius:50%;width:17%;height:20%;transform:translate(-50%,-50%);pointer-events:none}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}#reactionArena{height:250px;background:#e9f4ec;border-radius:12px;position:relative} .task-timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#e9f4ee;border:1px solid #bdd9c9;border-radius:15px;padding:12px 16px;margin:12px 0 16px}.task-timer #clock{display:block;font-size:clamp(34px,7vw,50px);font-variant-numeric:tabular-nums;line-height:1.15;margin:4px 0}.timer-label{font-size:12px;color:#527467}.timer-buttons{display:flex;gap:5px;flex-wrap:wrap}.urgent{animation:tickpulse .7s infinite alternate}@keyframes tickpulse{to{opacity:.5}}@media(max-width:450px){section{padding:14px}.timer-buttons button{padding:9px}} </style><h1>🌿 Фокус</h1><p>Игры для внимания, памяти и концентрации</p><section><div class="row"><span class="stat">⭐ Звёзды: <b id="stars">0</b></span><span class="stat">🏆 Победы: <b id="wins">0</b></span></div><h2>Выбери игру</h2><div class="row" id="tabs"><button data-game="schulte" class="active">🔢 Числа</button><button data-game="differences">🔎 Отличия</button><button data-game="memory">🃏 Карточки</button><button data-game="reaction">🎯 Реакция</button></div><p><label>Сложность: <select id="level"><option value="1">Легко</option><option value="2">Средне</option><option value="3">Сложно</option></select></label></p><h3 id="title"></h3><p id="instruction"></p><div class="task-timer"><div><div class="timer-label">⏳ Время на это задание</div><strong id="clock" aria-live="off">02:00</strong><div class="timer-label" id="timeInfo">Лёгкий уровень</div></div><div class="timer-buttons"><button id="pause">Пауза</button><button id="reset">Начать заново</button></div></div><p id="status"></p><div id="board"></div><div id="special"></div><p id="msg" aria-live="polite"></p><div class="row"><button id="new" class="primary">Новая игра</button><button id="hint">Подсказка</button><button id="next">Следующая игра →</button></div></section><section><h3>📊 Мой прогресс</h3><div id="records"></div><button id="clear">Очистить результаты</button><p style="font-size:12px;color:#61776b">Результаты сохраняются в этом браузере, если разрешено локальное хранилище. Для надёжного сохранения не перемещай файл и не используй приватный режим.</p></section><script>
(()=>{const $=id=>document.getElementById(id),keys=['schulte','differences','memory','reaction'],names=['Таблица Шульте','Найди отличия','Запомни карточки','Быстрая реакция'],desc=['Нажимай числа по порядку, начиная с 1.','Нажми на предметы, которые отличаются на правой картинке.','Запомни карточки, а затем найди одинаковые пары.','Нажимай на зелёные кружки. Красные пропускай.'];let game='schulte',level=1,score=0,remaining=120,timer=null,deadline=0,paused=false,delay=null,state={},generation=0;let data={stars:0,wins:0,best:{}};try{data={...data,...JSON.parse(localStorage.getItem('focus-offline-v1')||'{}')}}catch{}function persist(){try{localStorage.setItem('focus-offline-v1',JSON.stringify(data))}catch{}stats()}function stats(){$('stars').textContent=data.stars;$('wins').textContent=data.wins;$('records').innerHTML=keys.map((k,i)=>'<p>'+names[i]+': '+(data.best?.[k]??'—')+' очков</p>').join('')}function say(s){$('msg').textContent=s}function status(s){$('status').textContent=s}function add(n){score=Math.max(0,score+n)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function clear(){clearTimeout(delay);delay=null}function win(){if(state.finished||paused)return;state.finished=true;stop();clear();data.wins++;let reward=Math.max(1,Math.ceil(score/20));data.stars+=reward;data.best??={};data.best[game]=Math.max(data.best[game]||0,score);persist();status('Победа! '+score+' очков');say('🌟 Молодец! +'+reward+' звёзд')}function fresh(){stop();clear();$('hint').disabled=false;generation++;remaining=gameDuration();$('timeInfo').textContent=['Легко','Средне','Сложно'][level-1]+' · '+names[keys.indexOf(game)];paused=false;clock();$('pause').textContent='Пауза';state={finished:false};score=0;$('board').innerHTML='';$('special').innerHTML='';say('');status('Вперёд!');$('title').textContent=names[keys.indexOf(game)];$('instruction').textContent=desc[keys.indexOf(game)];if(game==='schulte')schulte();if(game==='differences')differences();if(game==='memory')memory();if(game==='reaction')reaction();startCountdown()}function schulte(){let n=level+2,total=n*n;state.next=1;$('board').style.gridTemplateColumns=`repeat(${n},1fr)`;$('board').innerHTML=shuffle(Array.from({length:total},(_,i)=>i+1)).map(v=>`<button class="tile" data-num="${v}">${v}</button>`).join('');status('Найди число 1');$('board').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(state.finished||paused)return;let v=+b.dataset.num;if(v===state.next){b.classList.add('found');b.disabled=true;add(10);state.next++;status('Найди число '+state.next);if(state.next>total)win()}else{add(-2);say('Попробуй ещё раз')}})}const positions=[[18,20],[51,19],[79,38],[25,70],[64,72],[85,84]],symbols=['🌻','🍎','🦋','🌳','🐱','☁️','⭐','🍄','🐝','🌈','🐞','🌷'];function differences(){let base=shuffle(symbols).slice(0,6),alternates=shuffle(symbols.filter(x=>!base.includes(x))),changed=shuffle([0,1,2,3,4,5]).slice(0,level+1),right=base.map((x,i)=>changed.includes(i)?alternates[changed.indexOf(i)]:x);state.changed=changed;state.found=new Set();function scene(arr,id){return `<div class="scene" id="${id}">`+arr.map((v,i)=>`<span class="object" style="left:${positions[i][0]}%;top:${positions[i][1]}%">${v}</span>`).join('')+'</div>'}$('special').innerHTML='<div class="scenes">'+scene(base,'leftScene')+scene(right,'rightScene')+'</div>';status('Найдено 0 из '+changed.length);$('rightScene').onclick=e=>{if(state.finished||paused)return;let rect=$('rightScene').getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100,i=positions.findIndex(([a,b])=>Math.abs(a-x)<11&&Math.abs(b-y)<13);if(changed.includes(i)&&!state.found.has(i)){state.found.add(i);add(25);let mark=document.createElement('div');mark.className='ring';mark.style.left=positions[i][0]+'%';mark.style.top=positions[i][1]+'%';$('rightScene').append(mark);status('Найдено '+state.found.size+' из '+changed.length);if(state.found.size===changed.length)win()}else{add(-2);say('Посмотри внимательнее')}}}function memory(){let pairs=[3,6,8][level-1],items=shuffle(['🐼','🦊','🐬','🐸','🦄','🐢','🐰','🐧'].slice(0,pairs).flatMap(x=>[x,x]));state.items=items;state.open=[];state.matched=new Set();state.lock=true;state.preview=true;$('board').style.gridTemplateColumns=`repeat(${pairs===3?3:4},1fr)`;$('board').innerHTML=items.map((x,i)=>`<button class="tile" data-card="${i}">${x}</button>`).join('');const g=generation;status('Запоминай карточки…');delay=setTimeout(()=>{if(g!==generation||state.finished)return;state.preview=false;state.lock=false;draw();status('Найди пары')},[5000,7000,9000][level-1]);function draw(){$('board').querySelectorAll('button').forEach(b=>{let i=+b.dataset.card;b.textContent=state.preview||state.open.includes(i)||state.matched.has(i)?items[i]:'?';b.classList.toggle('found',state.matched.has(i))})}$('board').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.card;if(state.lock||state.finished||paused||state.matched.has(i)||state.open.includes(i))return;state.open.push(i);draw();if(state.open.length===2){state.lock=true;let[a,c]=state.open;if(items[a]===items[c]){state.matched.add(a);state.matched.add(c);add(20);state.open=[];state.lock=false;draw();if(state.matched.size===items.length)win()}else{delay=setTimeout(()=>{state.open=[];state.lock=false;draw()},800)}}})}function reaction(){let total=[12,18,24][level-1],count=0;state.waiting=true;$('special').innerHTML='<div id="reactionArena"></div>';let g=generation;function next(){if(g!==generation||state.finished||paused)return;if(count>=total){win();return}state.waiting=true;$('reactionArena').innerHTML='<p style="text-align:center;padding:100px 0">Смотри внимательно…</p>';delay=setTimeout(()=>{if(g!==generation||state.finished||paused)return;count++;let green=Math.random()<.65,x=15+Math.random()*70,y=15+Math.random()*70;state.waiting=false;$('reactionArena').innerHTML=`<button id="target" aria-label="${green?'Зелёный':'Красный'}" style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);width:65px;height:65px;border-radius:50%;background:${green?'#56a986':'#df807b'}"></button>`;status('Попытка '+count+' из '+total);let handled=false;function complete(clicked){if(handled||g!==generation||state.finished||paused)return;handled=true;clear();state.waiting=true;if(green&&clicked){add(10);say('Верно!')}else if(!green&&!clicked){add(5);say('Правильно, красный пропущен!')}else{add(-3);say('В следующий раз получится!')}delay=setTimeout(next,350)}$('target').onclick=()=>complete(true);delay=setTimeout(()=>complete(false),[1800,1300,1000][level-1])},400+Math.random()*500)}next()}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;document.querySelectorAll('[data-game]').forEach(t=>t.classList.toggle('active',t===b));fresh()});$('level').onchange=e=>{level=+e.target.value;fresh()};$('new').onclick=fresh;$('next').onclick=()=>{game=keys[(keys.indexOf(game)+1)%4];document.querySelector(`[data-game="${game}"]`).click()};$('hint').onclick=()=>{if(state.finished||paused)return;add(-5);if(game==='schulte'){let b=document.querySelector(`[data-num="${state.next}"]`);if(b){b.style.outline='3px solid orange';setTimeout(()=>b.style.outline='',1200)}}else if(game==='differences'){let i=state.changed.find(i=>!state.found.has(i));say('Посмотри '+(positions[i][1]<45?'вверху':'внизу')+' картинки справа')}else if(game==='memory')say('Запоминай положение одинаковых картинок');else say('Зелёный — нажимай, красный — пропускай')};function gameDuration(){return {schulte:[60,45,30],differences:[90,60,45],memory:[90,60,45],reaction:[60,45,30]}[game][level-1]}function clock(){$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('clock').style.color=remaining<=10?'#bd4545':'#25433b';$('clock').classList.toggle('urgent',remaining<=10)}
function stop(){if(timer!==null){clearInterval(timer);timer=null}}
function timeUp(){if(state.finished)return;stop();clear();generation++;state.finished=true;paused=false;remaining=0;clock();$('board').querySelectorAll('button').forEach(b=>b.disabled=true);$('special').querySelectorAll('button').forEach(b=>b.disabled=true);$('rightScene')?.style.setProperty('pointer-events','none');$('hint').disabled=true;$('pause').disabled=true;data.best??={};data.best[game]=Math.max(data.best[game]||0,score);persist();status('⏰ Время вышло — игра окончена');say('Результат: '+score+' очков. Нажми «Новая игра», чтобы попробовать снова.');}
function startCountdown(){stop();paused=false;$('pause').disabled=false;$('pause').textContent='Пауза';deadline=Date.now()+remaining*1000;timer=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));clock();if(remaining===0)timeUp()},100)}

$('pause').onclick=()=>{if(state.finished)return;if(!paused){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();paused=true;$('pause').textContent='Продолжить';status('Пауза')}else{paused=false;$('pause').textContent='Пауза';startCountdown()}};
$('reset').onclick=fresh;

$('clear').onclick=()=>{if(confirm('Удалить сохранённые результаты?')){data={stars:0,wins:0,best:{}};persist()}};stats();clock();fresh()})();
</script></html>
